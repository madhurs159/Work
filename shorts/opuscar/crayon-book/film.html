<script>
// ============ Crayon Picture Book: the last bus ============
const comp=makeComp(document.getElementById('gl'),1080,1920);
const CR={ink:'#2b2d62',red:'#d4483c',yellow:'#f5c63c',orange:'#ec8a3c',skin:'#e0a078',brown:'#74452c',blue:'#6fa5d8',violet:'#7a5aa8',ochre:'#d9ae5a',green:'#5a9c58',pink:'#ee8ea4',white:'#fbfaf4'};
const WASHC=[0.15,0.19,0.44],PAPER=[0.957,0.937,0.890];
const seg=(t,a,b)=>clamp((t-a)/(b-a)),eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},eo=x=>1-Math.pow(1-clamp(x),3);
// global draw-on multipliers (lines reveal along their length, colouring row by row)
const DK={l:1,f:1};
const _line=line,_fill=fill;
line=(L,pts,o={})=>_line(L,pts,DK.l<1?{...o,draw:(o.draw??1)*DK.l}:o);
fill=(L,poly,o={})=>_fill(L,poly,DK.f<1?{...o,draw:(o.draw??1)*DK.f}:o);
const BF=layer(),BL=layer(),WX=layer(),WS=layer(),WS2=layer(),CH=group(),G2=group(),CK=layer(),CT=layer();
const LW=7.5,EX=-2600,AR=890,ROWS=[250,570,890,1210];
let T=null,S=[],CHK=[];
const X=x=>EX+x;
const rect=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
function rrect(x0,y0,x1,y1,r=14,n=4){const o=[],c=[[x1-r,y0+r,-Math.PI/2],[x1-r,y1-r,0],[x0+r,y1-r,Math.PI/2],[x0+r,y0+r,Math.PI]];for(const[cx,cy,a]of c)for(let k=0;k<=n;k++){const b=a+k/n*Math.PI/2;o.push([cx+Math.cos(b)*r,cy+Math.sin(b)*r])}return o}
const cl=p=>[...p,p[0],p[1]];
const lo=(seed,e={})=>({w:LW,seed,col:CR.ink,p:.92,...e});
function bgp(poly,fo,lo_){erase(BF,poly);erase(BL,poly);if(fo)fill(BF,poly,{boil:0,...fo});if(lo_)line(BL,cl(poly),{boil:.6,w:7,col:CR.ink,p:.9,...lo_})}
const bl=(pts,o={})=>line(BL,pts,{boil:.6,w:7,col:CR.ink,p:.9,...o});
function hole(C,poly,lo_){erase(C.f,poly);erase(C.l,poly);knock(C,poly);if(lo_)line(C.l,cl(poly),lo_)}

// ---- Devanagari-safe crayon lettering: whole words keep their shaping; each word is tilted, offset and boils
function dtext(L,str,x,y,o={}){const g=L.g,st=BOIL.step,seed=o.seed??7,ba=BOIL.amp*(o.boil??1),size=o.size??74;
  g.save();g.font=`700 ${size}px Kalam`;g.textBaseline='alphabetic';
  const words=str.split(' '),sp=g.measureText(' ').width*1.1,wd=words.map(w=>g.measureText(w).width),tw=wd.reduce((a,b)=>a+b,0)+sp*(words.length-1);
  let cx=o.align==='left'?x:x-tw/2,acc=0;const rv=(o.reveal??1)*tw;g.fillStyle=o.col||CR.ink;g.strokeStyle=g.fillStyle;g.lineJoin='round';
  words.forEach((w,i)=>{const vis=clamp((rv-acc)/wd[i]);if(vis>0){
    const jx=(hash(seed+i*3.3+st*1.1)-.5)*1.6*ba,jy=(hash(seed+i*7.1+st*2.3)-.5)*1.6*ba;
    const rot=(hash(seed+i*1.9)-.5)*.05+(hash(seed+i+st*.7)-.5)*.012*ba,by=(hash(seed+i*5.5)-.5)*size*.07;
    g.save();g.translate(cx+wd[i]/2+jx,y+by+jy);g.rotate(rot);
    if(vis<1){g.beginPath();g.rect(-wd[i]/2-12,-size*1.4,(wd[i]+24)*vis,size*2.2);g.clip()}
    g.globalAlpha=o.p??1;g.fillText(w,-wd[i]/2,0);
    if(o.stroke){g.lineWidth=o.stroke;g.globalAlpha=(o.p??1)*.75;g.strokeText(w,-wd[i]/2,0)}
    g.restore()}
    acc+=wd[i]+sp;cx+=wd[i]+sp});
  g.restore();return tw}
const wtext=(L,str,wx,wy,o={})=>dtext(L,str,sx(wx),sy(wy),{...o,size:(o.size??60)*CAM.s,stroke:o.stroke?o.stroke*CAM.s:0});
function measure(str,size){const g=CT.g;g.save();g.font=`700 ${size}px Kalam`;const w=g.measureText(str).width;g.restore();return w}

// ================= characters =================
function T0(o){const k=o.flip?-1:1;return pts=>xf(pts,{x:o.x||0,y:o.y||0,s:o.s||1,r:(o.r||0)*k,sx:k})}
// head: local origin = face centre, faces +x. turn -1..1 shifts the features; back = back of the head
function head(C,o){const P=T0(o),sd=o.seed||100,k=o.kind,Sc=o.s||1;
  const tx=(o.turn??.6)*15,ty=(o.up||0)*-9;
  const skinF={col:CR.skin,p:.66,gap:9,w:12,ang:.5,seed:sd+2,over:3};
  const hairF={col:CR.brown,p:.92,gap:7,w:10,ang:1.2,seed:sd+1,over:2.5,cross:true,crossP:.5};
  const dot=(x,y,r,col,s,p=.98)=>dab(C.l,...P([[x,y]])[0],r*Sc,{col,p,seed:sd+s,gap:3,w:4.5,over:.4});
  if(o.back){
    for(const s of[-1,1])part(C,P(ellipse(s*63,10,10,15,16)),skinF,lo(sd+60+s,{w:5}));
    part(C,P(ellipse(0,4,62,58,36)),skinF,lo(sd+7));
    const hair=smooth([[-67,12],[-72,-34],[-48,-70],[0,-84],[48,-70],[72,-34],[67,12],[44,34],[14,28],[-14,36],[-44,30]],5);
    part(C,P(hair),hairF,lo(sd+3));
    line(C.l,P(curve([[-18,-60],[-24,-20],[-20,18]])),lo(sd+4,{w:4,p:.6}));line(C.l,P(curve([[20,-62],[26,-22],[22,14]])),lo(sd+5,{w:4,p:.6}));
    line(C.l,P(curve([[-6,-84],[2,-102],[18,-98]])),lo(sd+11,{w:5}));
    return}
  if(k==='old'){
    const pallu=smooth([[-72,62],[-88,-18],[-64,-78],[0,-98],[64,-78],[86,-18],[70,62],[30,72],[-30,72]],6);
    part(C,P(pallu),{col:CR.violet,p:.88,gap:8,w:11,ang:1.0,seed:sd+1,over:4,cross:true,crossP:.5},lo(sd+3));
    const f=ellipse(tx*.3,6,57,55,40);part(C,P(f),skinF,lo(sd+7,{w:6.5}));
    const hx=tx*.3,hair=smooth([[hx-54,-2],[hx-51,-32],[hx-28,-47],[hx,-51],[hx+28,-47],[hx+51,-32],[hx+54,-2],[hx+30,-24],[hx,-31],[hx-30,-24]],4);
    part(C,P(hair),{col:CR.ink,p:.36,gap:5,w:7,ang:.2,seed:sd+8,over:1},null);
    line(C.l,P(smooth([[hx+54,-2],[hx+30,-24],[hx,-31],[hx-30,-24],[hx-54,-2]],4,false)),lo(sd+9,{w:4,p:.6}));
    line(C.l,P([[hx,-50],[hx+1,-31]]),lo(sd+10,{w:3.5,p:.6}));
    line(C.l,P(smooth([[-62,54],[-70,-10],[-50,-60],[0,-80],[50,-60],[70,-10],[62,54]],5,false)),{col:CR.yellow,w:5,p:.95,seed:sd+12});
    dot(tx,-16+ty,4.5,CR.red,13);
    for(const s of[-1,1]){line(C.l,P([[tx+s*36,-4+ty],[tx+s*45,-8+ty]]),lo(sd+14+s,{w:3,p:.6}));line(C.l,P(curve([[tx+s*20,36],[tx+s*27,42],[tx+s*22,50]])),lo(sd+17+s,{w:3,p:.5}))}
  }else{
    const ex=tx>4?[-58]:tx<-4?[58]:[-63,63];
    ex.forEach((x,i)=>part(C,P(ellipse(x,8,11,15,16)),skinF,lo(sd+5+i,{w:5})));
    part(C,P(ellipse(0,0,64,60,44)),skinF,null);line(C.l,P(ellipse(0,0,64,60,36,-0.2,Math.PI+0.2)),lo(sd+7));
    if(k==='arj'){const fr=tx*.5;
      const top=[[-66,-2],[-72,-38],[-50,-70],[-8,-85],[38,-77],[67,-46],[69,-8]],fringe=[[58,-26],[40,-40],[14+fr,-31],[-14+fr,-42],[-40+fr,-31],[-56,-12]];
      part(C,P(smooth([...top,...fringe],4)),hairF,null);
      line(C.l,P(smooth(top,6,false)),lo(sd+9));
      line(C.l,P(smooth([[69,-8],...fringe,[-66,-2]],4,false)),lo(sd+10,{w:4.5,p:.75}));
      line(C.l,P(curve([[-8,-85],[2,-104],[20,-99]])),lo(sd+11,{w:5.5}));
    }else{ // conductor: cap + side hair
      part(C,P(smooth([[-62,-4],[-66,-36],[-44,-40],[-50,-8]],4)),hairF,null);
      const crown=smooth([[-69,-32],[-67,-66],[-32,-90],[20,-92],[62,-76],[70,-36],[0,-46]],5);
      part(C,P(crown),{col:CR.ochre,p:.92,gap:7,w:10,ang:.3,seed:sd+1,over:2,cross:true},lo(sd+3));
      part(C,P(smooth([[14,-46],[70,-42],[100,-30],[94,-19],[36,-24]],4)),{col:CR.brown,p:.92,gap:5,w:7,seed:sd+4,over:1},lo(sd+13,{w:6}));
      dot(8,-66,6,CR.red,14);
    }}
  // --- features
  const exs=[tx-22,tx+22],ey=2+ty,e=o.eyes||'dot',lx=(o.lx||0)*4,ly=(o.ly||0)*4;
  exs.forEach((x,i)=>{
    if(e==='dot'){dot(x+lx*.5,ey+ly*.5,6.2,CR.ink,20+i);dot(x+lx*.5+2,ey+ly*.5-2.2,1.8,CR.white,22+i,1)}
    else if(e==='wide'){hole(C,P(ellipse(x,ey,13,14,20)),lo(sd+20+i,{w:4.5}));dot(x+lx,ey+ly,4.6,CR.ink,24+i)}
    else if(e==='hollow'){hole(C,P(ellipse(x,ey,14,15,20)),lo(sd+20+i,{w:6}))}
    else if(e==='closed')line(C.l,P(curve([[x-10,ey+3],[x,ey-7],[x+10,ey+3]])),lo(sd+20+i,{w:5}));
    else if(e==='shut')line(C.l,P(curve([[x-9,ey-1],[x,ey+5],[x+9,ey-1]])),lo(sd+20+i,{w:5}))});
  const b=o.brow,bc=k==='old'?{w:4,p:.6}:{w:5,p:.9,col:k==='con'?CR.brown:CR.ink};
  if(b)exs.forEach((x,i)=>{const s=i?1:-1,d=b==='worry'?-6:b==='up'?0:5,by=ey-(b==='up'?27:22);line(C.l,P([[x-s*10,by+d],[x+s*11,by-d*.3]]),lo(sd+50+i,bc))});
  line(C.l,P(curve([[tx+3,11+ty],[tx+10,18+ty],[tx+2,20+ty]])),lo(sd+41,{w:4,p:.7}));
  for(const s of[-1,1])dab(C.f,...P([[tx+s*40,23]])[0],10*Sc,{col:CR.pink,p:.75,seed:sd+30+s,sq:.75});
  const m=o.mouth||'smile',mx=tx+2,my=33+ty,redF={col:CR.red,p:.97,gap:3.5,w:6,seed:sd+44,over:.5};
  if(k==='con')part(C,P(smooth([[mx-24,my-9],[mx,my-15],[mx+26,my-9],[mx+30,my+2],[mx,my-5],[mx-28,my+2]],4)),{col:CR.brown,p:.95,gap:4,w:6,seed:sd+46,over:1},null);
  const mo=k==='con'?6:0;
  if(m==='smile')line(C.l,P(curve([[mx-14,my-4+mo],[mx,my+7+mo],[mx+14,my-4+mo]])),lo(sd+45,{w:5}));
  else if(m==='flat')line(C.l,P([[mx-11,my+mo],[mx+11,my+1+mo]]),lo(sd+45,{w:5}));
  else if(m==='sad')line(C.l,P(curve([[mx-12,my+6],[mx,my-2],[mx+12,my+6]])),lo(sd+45,{w:5}));
  else if(m==='o')part(C,P(ellipse(mx,my+3,8,10,16)),{...redF,col:CR.ink,p:.9},lo(sd+45,{w:4}));
  else if(m==='shout')part(C,P(smooth([[mx-15,my-9],[mx+15,my-10],[mx+19,my+8],[mx,my+21],[mx-17,my+8]],5)),redF,lo(sd+45,{w:5}));
  else if(m==='shout2')part(C,P(ellipse(mx,my+3,13,10,18)),redF,lo(sd+45,{w:5}));
  else if(m==='wavy')line(C.l,P([[mx-17,my+1],[mx-9,my-5],[mx,my+3],[mx+9,my-5],[mx+17,my+1]]),lo(sd+45,{w:5}));
  else if(m==='laugh'){part(C,P(smooth([[mx-23,my-8],[mx+23,my-8],[mx+17,my+12],[mx,my+19],[mx-17,my+12]],4)),redF,lo(sd+45,{w:5}));hole(C,P(rect(mx-6,my-8,mx+5,my+2)),lo(sd+47,{w:3}))}
  else if(m==='grin'){hole(C,P(smooth([[mx-27,my-8],[mx,my-2],[mx+27,my-8],[mx+19,my+10],[mx,my+15],[mx-19,my+10]],4)),lo(sd+45,{w:5}));for(const d of[-12,0,12])line(C.l,P([[mx+d,my-3],[mx+d*.9,my+11]]),lo(sd+47+d,{w:3,p:.7}))}
  if(o.sweat){const s=tx>=0?-1:1;[[s*58,-36,1],[s*72,-8,.8]].forEach(([x,y,q],i)=>part(C,P(smooth([[x,y-12*q],[x+7*q,y+3*q],[x,y+10*q],[x-7*q,y+3*q]],4)),{col:CR.blue,p:.9,gap:3.5,w:5,seed:sd+70+i,over:.5},lo(sd+72+i,{w:3.5})))}
}
const KIND={arj:{top:CR.blue,leg:CR.ink,legP:.64,shoe:CR.brown},old:{top:CR.violet,leg:CR.violet,legP:.88,shoe:CR.brown},con:{top:CR.ochre,leg:CR.brown,legP:.86,shoe:CR.brown}};
function limb(C,P,pts,w0,w1,fo,sd){part(C,P(tube(curve(pts,5),w0,w1)),fo,lo(sd))}
function mitt(C,P,x,y,sd){part(C,P(ellipse(x,y,15,14,18)),{col:CR.skin,p:.66,gap:8,w:10,seed:sd,over:2},lo(sd+1,{w:6}))}
function note(C,P,x,y,sd){part(C,P(xf(rect(-22,-13,22,13),{x,y,r:-.25})),{col:CR.green,p:.95,gap:4,w:6,seed:sd,over:1},lo(sd+1,{w:5}));line(C.l,P(ellipse(x,y,5,5,10)),lo(sd+2,{w:3}))}
// seated side view; (x,y) = hip on the cushion
function seated(C,o){const P=T0(o),K=KIND[o.kind],sd=o.seed,Pu=pts=>P(xf(pts,{r:o.lean||0}));
  const topF={col:K.top,p:.88,gap:9,w:12,ang:.9,seed:sd+1,over:5,cross:true,crossP:.5},legF={col:K.leg,p:K.legP,gap:8,w:11,ang:.3,seed:sd+2,over:4};
  if(o.armF){limb(C,Pu,[[-2,-98],...o.armF],28,24,topF,sd+30);mitt(C,Pu,...o.armF[1],sd+32)}
  if(o.kind==='old'){part(C,P(ellipse(98,92,24,11,16)),{col:K.shoe,p:.9,gap:5,w:7,seed:sd+5},lo(sd+4,{w:6}));
    part(C,P(smooth([[-38,-22],[58,-28],[98,-12],[106,82],[62,88],[52,22],[-38,14]],5)),legF,lo(sd+6))}
  else{part(C,P(ellipse(108,86,28,13,18)),{col:K.shoe,p:.9,gap:5,w:7,seed:sd+5},lo(sd+4,{w:6}));limb(C,P,[[2,-12],[74,-18],[94,-6],[94,76]],46,34,legF,sd+6)}
  part(C,Pu(smooth([[-38,10],[-46,-60],[-36,-104],[-6,-120],[26,-112],[40,-70],[40,10]],6)),topF,lo(sd+8));
  if(o.kind==='old')line(C.l,Pu(curve([[-28,-112],[8,-62],[36,-6]])),{col:CR.yellow,w:5.5,p:.95,seed:sd+9});
  const hp=Pu([[4+(o.hx||0),-176+(o.hy||0)]])[0];
  head(C,{...o.head,kind:o.kind,seed:sd+100,x:hp[0],y:hp[1],s:o.s,flip:o.flip,r:(o.lean||0)+(o.headR||0)});
  const a=o.armN||[[14,-48],[52,-32]];limb(C,Pu,[[2,-96],...a],30,25,topF,sd+40);mitt(C,Pu,...a[1],sd+42);
  if(o.note)note(C,Pu,a[1][0]+20,a[1][1]-8,sd+45)}
// standing; (x,y) = feet. walk: 0 stride / 1 passing / undefined = still
function standing(C,o){const P=T0(o),K=KIND[o.kind],sd=o.seed,HY=-112,up=p=>p.map(([x,y])=>[x,y+HY]);
  const topF={col:K.top,p:.88,gap:9,w:12,ang:.9,seed:sd+1,over:5,cross:true,crossP:.5},legF={col:K.leg,p:K.legP,gap:8,w:11,ang:.3,seed:sd+2,over:4};
  const legs=o.walk===0?[[[-6,HY+6],[-26,-56],[-44,-8]],[[8,HY+6],[30,-58],[42,-8]]]:o.walk===1?[[[-2,HY+6],[-5,-56],[-3,-8]],[[6,HY+6],[30,-66],[10,-30]]]:[[[-14,HY+6],[-16,-56],[-16,-8]],[[14,HY+6],[16,-56],[16,-8]]];
  legs.forEach((l,i)=>{const e=l[2];part(C,P(ellipse(e[0]+12,e[1]+5,24,11,16)),{col:K.shoe,p:.9,gap:5,w:7,seed:sd+5+i},lo(sd+3+i,{w:6}));limb(C,P,l,40,32,legF,sd+6+i*3)});
  if(o.pack)part(C,P(smooth([[-74,HY-102],[-44,HY-114],[-34,HY-24],[-70,HY-22]],4)),{col:CR.orange,p:.92,gap:7,w:10,seed:sd+20,over:3,cross:true},lo(sd+21));
  if(o.armF){limb(C,P,up([[-2,-98],...o.armF]),28,24,topF,sd+30);mitt(C,P,...up([o.armF[1]])[0],sd+32)}
  part(C,P(up(smooth([[-38,10],[-46,-60],[-36,-104],[-6,-120],[26,-112],[40,-70],[40,10]],6))),topF,lo(sd+8));
  if(o.kind==='con'){line(C.l,P(up(curve([[-30,-110],[6,-60],[30,-18]]))),{col:CR.brown,w:7,p:.95,seed:sd+22});
    part(C,P(up(rrect(8,-36,56,12,8))),{col:CR.brown,p:.92,gap:5,w:8,seed:sd+23,over:1.5},lo(sd+24,{w:6}))}
  head(C,{...o.head,kind:o.kind,seed:sd+100,...(([x,y])=>({x,y}))(P([[4,HY-176]])[0]),s:o.s,flip:o.flip,r:o.headR||0});
  const a=o.armN||[[8,-50],[14,-8]];limb(C,P,up([[2,-96],...a]),30,25,topF,sd+40);mitt(C,P,...up([a[1]])[0],sd+42);
  if(o.tickets){const[hx,hy]=up([a[1]])[0];part(C,P(xf(rect(-8,-20,10,10),{x:hx+10,y:hy-12,r:.2})),{col:CR.pink,p:.9,gap:4,w:6,seed:sd+50},lo(sd+51,{w:4}))}}

// ================= exterior page (bus stop / the road home) =================
function house(x,w,h,sd,roof=1){const y=1000;
  bgp(rect(x,y-h,x+w,y),{col:CR.ochre,p:.88,gap:9,w:12,ang:.4,seed:sd,cross:true},{seed:sd+1});
  if(roof)bgp([[x-16,y-h],[x+w/2,y-h-78],[x+w+16,y-h]],{col:CR.red,p:.92,gap:7,w:10,ang:.1,seed:sd+2,cross:true},{seed:sd+3});
  const nx=Math.max(1,Math.round(w/110)),ny=Math.max(1,Math.floor((h-80)/120));
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){if(hash(sd+i*7+j*3)<.25)continue;const wx=x+(i+.5)*w/nx-24,wy=y-h+34+j*120;bgp(rect(wx,wy,wx+48,wy+58),{col:CR.yellow,p:.97,gap:4,w:7,seed:sd+9+i+j*5,over:1},{w:5,seed:sd+30+i+j*5})}}
function lamp(x,sd){bl(curve([[x,1002],[x,470],[x+6,428],[x+30,414],[x+62,414]],6),{seed:sd,w:8});
  for(let k=0;k<9;k++){const a=k/9*6.283+.3;bl([[x+66+Math.cos(a)*38,432+Math.sin(a)*32],[x+66+Math.cos(a)*(62+hash(sd+k)*16),432+Math.sin(a)*(54+hash(sd+k)*14)]],{col:CR.yellow,w:6,p:1,seed:sd+10+k,boil:1})}
  bgp(ellipse(x+66,432,24,17,18),{col:CR.yellow,p:1,gap:3.5,w:6,seed:sd+2,over:1},{w:5,seed:sd+3})}
function stopSign(x){bl([[x,1002],[x,652]],{seed:71,w:8});
  bgp(rrect(x-108,548,x+108,652,16),{col:CR.yellow,p:.97,gap:6,w:9,ang:.3,seed:72,cross:true},{seed:73});

    g.globalAlpha=.88;g.beginPath();g.rect(...P(h-50,540),300*s*pr,245*s);g.fill();
    g.globalAlpha=.1;g.lineWidth=3*s;for(let q=0;q<5;q++){g.beginPath();g.moveTo(...P(h-50,575+q*44+wn(h,q)));g.lineTo(...P(h-50+300*pr,580+q*44+wn(h+300,q)));g.stroke()}
    g.restore();g.globalAlpha=1})}
// the second, heavy coat of the same ultramarine: the brush crosses Arjun's window and the white wax answers
function coat2(t){const g=WS2.g,h=AR,s=CAM.s,P=(x,y)=>[sx(x),sy(y)],wn=y=>(vnoise(y/9)-.5)*12;g.fillStyle='#000';
  const q=seg(t,T.lines[6].start,T.lines[6].start+.5),fx=h-50+320*q;
  g.save();g.beginPath();pane(h).forEach(([x,y],j)=>{const[a,b]=P(x,y);j?g.lineTo(a,b):g.moveTo(a,b)});g.closePath();g.clip();
  g.globalAlpha=.92;g.beginPath();let f=true;for(let y=540;y<=790;y+=6){const[a,b]=P(fx+wn(y),y);f?g.moveTo(a,b):g.lineTo(a,b);f=false}g.lineTo(...P(h-60,790));g.lineTo(...P(h-60,540));g.closePath();g.fill();
  if(q<1)for(let m=0;m<5;m++){g.globalAlpha=.2;g.beginPath();g.rect(...P(fx-(40-m*7),540),(40-m*7)*s,250*s);g.fill()}
  g.restore();g.globalAlpha=1}
// white wax in Arjun's window: the reflection of his seat, with nobody in it
function reflection(){const h=AR,gl=(pts,e={})=>line(WX,pts,{col:CR.white,p:1,w:9,seed:800,boil:.9,...e});
  const g=WX.g;g.save();g.beginPath();pane(h).forEach(([x,y],j)=>j?g.lineTo(sx(x),sy(y)):g.moveTo(sx(x),sy(y)));g.closePath();g.clip();
  const fq=seg(TT,T.lines[6].start,T.lines[6].start+.5);g.beginPath();g.rect(sx(h-60),sy(530),(320*fq+6)*CAM.s,270*CAM.s);g.clip();
  const x=h+152,WF={col:CR.white,p:.92,gap:6,w:8,ang:.7,boil:.6,over:1};
  const back=smooth([[x-70,764],[x-76,612],[x-66,588],[x-44,588],[x-36,612],[x-34,742]],4),cush=smooth([[x-72,738],[x+56,738],[x+68,753],[x+56,769],[x-72,769]],3);
  fill(WX,back,{...WF,seed:820});gl(cl(back),{seed:801,w:8});fill(WX,cush,{...WF,seed:821,ang:.2});gl(cl(cush),{seed:802,w:8});
  for(let k=0;k<4;k++){const a=-2.3+k*.72,cx=x+14+Math.cos(a)*62,cy=690+Math.sin(a)*66,l=k%2?9:6;gl([[cx-l,cy],[cx+l,cy]],{seed:810+k,w:4});gl([[cx,cy-l],[cx,cy+l]],{seed:814+k,w:4})}
  g.restore()}

// ================= printed words =================
function chunks(L){if(L._c)return L._c;const parts=L.say.split(/(?<=[।,?!])\s*/).filter(Boolean),tot=parts.reduce((a,p)=>a+p.length,0);let s=L.start;
  return L._c=parts.map(p=>{const d=(L.end-L.start)*p.length/tot,o={s,e:s+d,p:p.replace(/[।,]$/,'')};s+=d;return o})}
function caption(t){for(let li=0;li<T.lines.length;li++){const L=T.lines[li];if(t<L.start-.05||t>L.end+.3)continue;const cs=chunks(L),ci=Math.max(0,cs.findIndex(c=>t<c.e)<0?cs.length-1:cs.findIndex(c=>t<c.e)),c=cs[ci];
  const size=76;let rows=[c.p];if(measure(c.p,size)>900){const w=c.p.split(' ');let best=1,bd=1e9;for(let k=1;k<w.length;k++){const d=Math.abs(measure(w.slice(0,k).join(' '),size)-measure(w.slice(k).join(' '),size));if(d<bd){bd=d;best=k}}rows=[w.slice(0,best).join(' '),w.slice(best).join(' ')]}
  const mw=Math.max(...rows.map(r=>measure(r,size))),cy=1572,ph=rows.length*100+56,pw=mw+110,sd=li*10+ci;
  const g=CK.g;g.fillStyle='#000';g.beginPath();const n=72;for(let k=0;k<n;k++){const a=k/n*6.2832,ca=Math.cos(a),sa=Math.sin(a),e=.3;
    const px=540+pw/2*Math.sign(ca)*Math.pow(Math.abs(ca),e)+(vnoise(k*1.7+sd)-.5)*20,py=cy-14+ph/2*Math.sign(sa)*Math.pow(Math.abs(sa),e)+(vnoise(k*1.3+sd+9)-.5)*18;k?g.lineTo(px,py):g.moveTo(px,py)}
  g.closePath();g.fill();
  const rv=seg(t,c.s,c.s+.35)*rows.length;
  rows.forEach((r,k)=>dtext(CT,r,540,cy+(k-(rows.length-1)/2)*100+16,{size,seed:sd*3+k,reveal:clamp(rv-k),stroke:1.6}));return}}

// ================= camera =================
function pose(i,lt,d){const p=lt/d;
  if(i===0)return[X(540)-16*p,660,1+.06*p];
  if(i===1)return[lerp(1010,560,eio(seg(lt,.8,4.5))),765,1.15];
  if(i===2)return[lerp(880,770,eio(seg(lt,.8,5.2))),753,1.5];
  if(i===3)return[lerp(702,710,p),758,lerp(1.5,1.56,p)];
  if(i===4)return[262,782,lerp(2.9,3.3,eo(p*.9))];
  if(i===5){const k=eio(seg(lt,CHK[5][1].s-S[5]-.1,CHK[5][1].s-S[5]+.8));return[lerp(AR-4,AR+62,k),lerp(772,716,k),lerp(2.8,3.0,k)]}
  if(i===6)return[AR+82,694,3.2+.12*p];
  const vo=T.lines[7].end-S[7],k=eio(seg(lt,vo+.1,vo+.85));return[X(540),lerp(660,1500,k),1]}
function camera(t,i){const lt=t-S[i],d=S[i+1]-S[i];let c=pose(i,lt,d);const bd=i===6?.3:.42;
  if(i>0&&lt<bd){const a=pose(i-1,S[i]-S[i-1],S[i]-S[i-1]),k=eio(lt/bd);c=[lerp(a[0],c[0],k),lerp(a[1],c[1],k),Math.exp(lerp(Math.log(a[2]),Math.log(c[2]),k))]}
  if(i===6){const q=t-T.lines[6].start;if(q>=0&&q<.4){const st=Math.floor(q*15);c[0]+=(hash(st*3.1)-.5)*14*(1-q/.4);c[1]+=(hash(st*5.7)-.5)*14*(1-q/.4)}}
  CAM.x=c[0];CAM.y=c[1];CAM.s=c[2]}

window.render=function(t){
  const st=Math.floor(t*15+1e-6),tq=st/15;BOIL.step=st;TQ=tq;TT=t;
  let i=0;for(let k=0;k<8;k++)if(t>=S[k])i=k;
  camera(t,i);comp.paperCam(CAM.x,CAM.y,CAM.s);
  // boil: full normally, calmer when the film goes quiet, a jolt on the sting
  let amp=1;if(i===3&&tq>=CHK[3][3].s)amp=.5;if(i===4&&tq>=CHK[4][3].s+.6)amp=.55;if(i===6){const q=t-T.lines[6].start;amp=q>=0&&q<.6?2.2:.8}if(i===7&&t>CHK[7][1].e)amp=.6;BOIL.amp=amp;
  for(const L of[BF,BL,WX,WS,WS2,CK,CT])clear(L);clearGroup(CH);clearGroup(G2);
  const v0=CAM.x-560/CAM.s,v1=CAM.x+560/CAM.s,visE=v0<EX+1700,visI=v1>-200;
  sky();
  if(visE)exterior(t,tq,i);
  if(visI){interiorBG(t,tq,i);interiorChars(t,tq,i);if(i===6||(i===7&&t<S[7]+.5))reflection()}
  drawWash(t,i);const c2=visI&&t>=T.lines[6].start;if(c2)coat2(t);caption(t);
  comp.begin(PAPER);comp.crayon(BF.c);comp.crayon(BL.c);comp.crayon(WX.c);comp.wash(WS.c,{color:WASHC});if(c2)comp.wash(WS2.c,{color:[.36,.4,.64],edge:1.2});
  comp.group(CH);comp.group(G2);comp.knock(CK.c,PAPER);comp.crayon(CT.c);comp.finish({vig:.3,emb:.55})};
window.init=async function(tm){T=tm;S=T.lines.map((L,k)=>k?L.start-.3:0);S.push(T.total);CHK=T.lines.map(chunks);
  await document.fonts.load('700 60px Kalam','कहानी फ़ॉलो 11:40 PM km');await document.fonts.ready;return true};
</script>
