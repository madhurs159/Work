function chunks(L) { return L._c || (L._c = L.ck.map(x => ({ s: x.s, e: x.e, p: x.p.replace(/[।,]$/, '') }))); }

const NROOM = { tint: [.9, .95, 1.1], shadowTint: [.04, .06, .2], bloom: .85 }, DAY = { tint: [1.06, 1.0, .9], shadowTint: [.12, .08, .05], bloom: .7 },
